connections:
  - id: primary-pg
    type: postgres
    connectionString: ${POSTGRES_URL}
    statementTimeoutMs: 30000
    readOnly: true
  - id: reporting-pg
    type: postgres
    connectionString: ${REPORTING_POSTGRES_URL}
    readOnly: true
  - id: cache
    type: redis
    connectionString: ${REDIS_URL}
    readOnly: false
  - id: logs-es
    type: elasticsearch
    connectionString: ${ELASTICSEARCH_URL}
    readOnly: true
