connections:
  - id: primary-pg
    type: postgres
    connectionString: ${POSTGRES_URL}
    statementTimeoutMs: 30000
    readOnly: true
  - id: reporting-pg
    type: postgres
    connectionString: ${REPORTING_POSTGRES_URL}
    readOnly: true
  - id: cache
    type: redis
    connectionString: ${REDIS_URL}
    readOnly: false
  - id: logs-es
    type: elasticsearch
    connectionString: ${ELASTICSEARCH_URL}
    readOnly: true
  - id: legacy-es
    type: elasticsearch
    connectionString: ${LEGACY_ELASTICSEARCH_URL}
    apiVersion: "7" # Talks to an Elasticsearch 7.x cluster via a separate v7 client
    readOnly: true
  - id: main-mysql
    type: mysql
    connectionString: ${MYSQL_URL}
    statementTimeoutMs: 30000
    readOnly: true
  - id: app-mongo
    type: mongodb
    connectionString: ${MONGODB_URL}
    defaultDatabase: mydatabase
    readOnly: true
